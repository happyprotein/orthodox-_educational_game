<style>
/* VOICE: grave, warm, a little wry — a monk reading council acts by lamplight
   IDEA: a Palaiologan fresco wall that the trial plays out on; UI is plaster, gold leaf and wax
   PICTURE: full-bleed fresco scenes, cut-out fresco portraits, dialogue on an ornamented plaster band
   COLOUR and TYPE: ink #1b1410, gold leaf #c9a24a, terracotta #9c3b22, lapis #23365e, plaster #efe4c8; Cinzel for names, Noto Serif (Greek-capable) for speech
   LAYOUT: fixed 16:9 stage scaled to fit; HUD top, portrait centre, dialogue band bottom, modals over a dimmed wall */
:root{--disp:Cinzel,"Noto Serif",serif;color-scheme:dark;--ink:#1b1410;--gold:#c9a24a;--terra:#9c3b22;--lapis:#23365e;--plaster:#efe4c8;--plaster2:#e2d3ad}
:root:lang(sr-Cyrl){--disp:"Cormorant SC","Noto Serif",serif}
:root:lang(sr-Cyrl) #title h1{font-size:112px}:root:lang(sr-Cyrl) #name{font-size:21px;padding-top:4px}:root:lang(sr-Cyrl) .mt span{font-size:14px;font-weight:700}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#120d0a;overflow:hidden}
body{font:20px/1.5 "Noto Serif",Georgia,serif;color:var(--ink)}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:absolute;width:1280px;height:720px;left:50%;top:50%;transform-origin:center;overflow:hidden;background:#000;user-select:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s}
#bg2{opacity:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(10,6,3,.55));pointer-events:none}
#por{position:absolute;left:50%;bottom:150px;height:560px;transform:translateX(-50%);filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));transition:opacity .3s,transform .3s;opacity:0}
#por.on{opacity:1}
#por.think{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) brightness(.92)}
.shake{animation:psh .5s}
@keyframes psh{0%,100%{transform:translateX(-50%)}15%{transform:translate(calc(-50% - 16px),3px) rotate(-1deg)}30%{transform:translate(calc(-50% + 14px),-4px) rotate(1deg)}45%{transform:translate(calc(-50% - 10px),2px)}60%{transform:translate(calc(-50% + 7px),-2px)}80%{transform:translate(calc(-50% - 3px),0)}}
@keyframes sh{0%,100%{transform:translate(0)}20%{transform:translate(-14px,4px)}40%{transform:translate(12px,-6px)}60%{transform:translate(-8px,3px)}80%{transform:translate(5px,-2px)}}
#box{position:absolute;left:40px;right:40px;bottom:18px;height:190px;border-style:solid;border-width:26px 0;border-image:url(assets/ui/okvir.jpg) 95 0 95 0 fill / 26px 0 26px 0 round stretch;padding:14px 46px 10px;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#name{position:absolute;left:38px;top:-50px;background:var(--terra);color:#f4e2b5;font:700 19px var(--disp);letter-spacing:.04em;padding:6px 20px 5px;border:2px solid var(--gold);border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
#name:empty{display:none}
#txt{font-size:21px;line-height:1.5;min-height:90px}
#txt.th{font-style:italic;color:#4a3a2a}
#txt.na{font-style:italic;color:#3b2d20}
#more{position:absolute;right:30px;bottom:6px;color:var(--terra);font-size:18px;animation:bl 1.1s infinite}
@keyframes bl{50%{opacity:.2}}
#ctrl{position:absolute;left:46px;right:46px;bottom:4px;display:none;gap:10px;justify-content:flex-end;align-items:center}
#ctrl.on{display:flex}
#stno{margin-right:auto;font:500 15px var(--disp);color:var(--terra)}
button{font:600 16px "Noto Serif",serif;color:#f6ead0;background:var(--lapis);border:2px solid var(--gold);border-radius:4px;padding:8px 16px;min-height:40px;cursor:pointer;box-shadow:0 2px 0 #0e1830}
button:hover{background:#2e4677}button:focus-visible{outline:3px solid #f3d27a;outline-offset:2px}
button.r{background:var(--terra);box-shadow:0 2px 0 #5a2112}button.r:hover{background:#b44a2c}
button:disabled{opacity:.45;cursor:not-allowed}
#hud{position:absolute;left:16px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.mt{display:flex;gap:2px;align-items:center;background:rgba(27,20,16,.55);padding:3px 10px 3px 8px;border-radius:24px}
.mt span{font:500 13px var(--disp);color:#e9d7a8;margin-right:6px;width:92px}
.mt img{width:34px;height:34px;object-fit:contain;transition:filter .4s,opacity .4s}
.mt img.off{filter:grayscale(1) brightness(.5);opacity:.45}
#pov{display:none}#pov.on{display:flex}
#tools{position:absolute;right:16px;top:12px;display:flex;gap:8px;z-index:5}
#tools button{font-size:15px;padding:6px 14px}
.badge{display:inline-block;margin-left:6px;background:var(--gold);color:var(--ink);border-radius:10px;padding:0 7px;font-size:13px}
#cap{position:absolute;left:50%;top:70px;transform:translateX(-50%);font:500 22px var(--disp);color:#f6e7c1;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .8s;white-space:nowrap}
#cap.on{opacity:1}
.ov{position:absolute;inset:0;background:rgba(14,9,6,.72);display:none;place-items:center;z-index:20}
.ov.on{display:grid}
.card{background:var(--plaster);border:3px solid var(--gold);border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.7);padding:26px 32px;max-width:860px;width:calc(100% - 120px);max-height:640px;overflow:auto;position:relative}
.card h2{font:700 26px/1.15 var(--disp);margin:0 0 12px;color:var(--terra)}
.card p{margin:.4em 0}
.choices{display:flex;flex-direction:column;gap:12px;width:760px}
.choices button{font-size:19px;text-align:left;padding:14px 22px;background:rgba(239,228,200,.96);color:var(--ink);box-shadow:0 3px 0 #8b7347}
.choices button:hover{background:#fff6dc}
.choices button.lk{opacity:.7;font-style:italic;background:rgba(160,150,130,.9)}
.choices .q{font:600 20px var(--disp);color:#f3e2b4;text-align:center;margin-bottom:6px;text-shadow:0 2px 6px #000}
.book{position:relative;width:1080px;height:720px;background:center/100% 100% no-repeat;filter:drop-shadow(0 18px 40px rgba(0,0,0,.7))}
.pg{position:absolute;display:flex;flex-direction:column}
#kod .book{background-image:url(assets/ui/kodeks_knjiga.jpg)}
#kod .pl{left:21%;top:15%;width:25.5%;height:70%}
#kod .pr{left:55%;top:15%;width:26%;height:70%}
.bh{font:700 24px/1.1 var(--disp);color:var(--terra);margin:0 0 10px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start;overflow:auto}
.it{aspect-ratio:3/2;background:url(assets/ui/slot.jpg) center/100% 100%;border:2px solid transparent;border-radius:4px;display:grid;place-items:center;cursor:pointer}
.it img{width:62%;height:62%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.it:hover,.it.sel{border-color:var(--terra);box-shadow:0 0 0 2px rgba(201,162,74,.6)}
.it:focus-visible{outline:3px solid var(--terra)}
#kodD{flex:1;overflow:auto;text-align:center;font-size:16px;line-height:1.45}
#kodD img{width:150px;height:120px;object-fit:contain;display:block;margin:4px auto 6px}
#kodD h3{font:700 21px/1.15 var(--disp);color:var(--terra);margin:0 0 8px}
#kodD .em{font-style:italic;color:#6b5236;margin-top:40px}
.bk{display:flex;gap:10px;justify-content:center;margin-top:10px}
#teo .book{background-image:url(assets/ui/teo_knjiga.jpg)}
#teo .book.gold{background-image:url(assets/ui/teo_zlatna.jpg)}
#teo .pl{left:14%;top:22.5%;width:26.5%;height:57%}
#teo .pr{left:58%;top:22.5%;width:26.5%;height:57%}
#teo .book.gold .pl{left:14.5%;top:22%;width:29%;height:61%}
#teo .book.gold .pr{left:46%;top:22%;width:40%;height:61%}
#teoM{width:100%;aspect-ratio:3/2;object-fit:cover;border:2px solid #a8842f;box-shadow:0 2px 6px rgba(0,0,0,.25);flex:none}
#teoL{display:flex;flex-direction:column;gap:2px;margin-top:10px;overflow:auto}
#teoL button{all:unset;cursor:pointer;font-size:14px;line-height:1.35;color:#3b2d20;padding:2px 6px;border-radius:3px}
#teoL button:hover,#teoL button:focus-visible{background:rgba(201,162,74,.3)}
#teoL button.cur{color:var(--terra);font-weight:600}
#teoL button.g::before{content:"✦ ";color:#a8842f}
#teoH{font:700 21px/1.15 var(--disp);color:#7a2c17;margin:0 0 8px;flex:none}
#teoP{flex:1;overflow:auto;white-space:pre-line;font-size:15px;line-height:1.45;padding-right:4px}
.book.gold #teoP{font-size:16px}
#teoS{font-size:13px;color:#6b5236;margin-top:6px;font-style:italic;flex:none}
.xb{position:absolute;right:20px;top:14px;min-height:36px;padding:4px 14px}
.grid0{display:grid}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#give .card{text-align:center;max-width:560px}
#give img{width:150px;height:130px;object-fit:contain}
.tag{font:500 14px var(--disp);color:var(--terra);letter-spacing:.05em}
#toast{position:absolute;right:16px;top:64px;z-index:30;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.ts{background:rgba(27,20,16,.88);color:#f3e2b4;border:1px solid var(--gold);padding:7px 14px;border-radius:4px;font-size:15px;animation:tin 3.2s forwards}
@keyframes tin{0%{opacity:0;transform:translateY(-6px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
#splash{position:absolute;inset:0;z-index:25;display:none;place-items:center;background:url(assets/ui/splash.jpg) center/cover}
#splash.on{display:grid;animation:sp .9s forwards}
#splash b{font:700 120px var(--disp);color:var(--terra);text-shadow:0 0 0 #000,4px 4px 0 #f3e2b4;transform:rotate(-6deg)}
@keyframes sp{0%{opacity:0;transform:scale(1.15)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#title,#endscr,#cardscr{position:absolute;inset:0;z-index:40;display:none;place-items:center;text-align:center;color:#f6e7c1;background:rgba(18,12,8,.55)}
#title.on,#endscr.on,#cardscr.on{display:grid}
#title h1{font:700 118px/1 var(--disp);margin:0;text-shadow:0 4px 18px #000;color:#f3dfa6}
#title .sub{font:500 26px var(--disp);margin:10px 0 34px;text-shadow:0 2px 8px #000}
#title .gr{font-size:22px;opacity:.9;text-shadow:0 2px 6px #000}
#title .bt{display:flex;gap:16px;justify-content:center}
#title button{font-size:20px;padding:12px 30px}
.lng{display:flex;gap:8px;justify-content:center;margin-top:18px}.lng button{font-size:15px;padding:5px 14px;min-height:34px;background:rgba(27,20,16,.6)}.lng button.on{background:var(--terra)}
.small{font-size:14px;opacity:.75;margin-top:26px;text-shadow:0 1px 4px #000}
#cardscr{background:rgba(18,12,8,.82);cursor:pointer}
#cardscr .a{font:500 24px var(--disp);color:var(--gold);letter-spacing:.12em}
#cardscr .b{font:700 54px/1.1 var(--disp);margin-top:10px}
#endscr{background:rgba(18,12,8,.86)}
#endscr h2{font:700 54px var(--disp);margin:0 0 10px;color:#f3dfa6}
#endscr p{font-size:20px;margin:.3em 0}
.tease{margin-top:26px;font:500 24px var(--disp);color:var(--gold)}
.ln{display:block;width:100%;text-align:left;background:#f7eedb;color:var(--ink);border:2px solid #cbb486;margin:8px 0;font-size:19px;box-shadow:none}
.ln:hover{background:#fff7e6;border-color:var(--terra)}
.ln b{color:var(--terra);margin-right:10px}
.gk{font-size:24px;line-height:2.1}
.gk span{cursor:pointer;padding:2px 3px;border-radius:3px}
.gk span:hover{background:#f3d27a}
.lt{font-size:64px;display:flex;justify-content:center;gap:4px;margin:16px 0}
.lt span{cursor:pointer;padding:0 6px;border-radius:4px;border:2px solid transparent}
.lt span:hover{border-color:var(--terra);background:#fff3d0}
.msg{min-height:28px;color:var(--terra);font-style:italic;margin-top:8px}
#stage.menu #box,#stage.menu #hud,#stage.menu #tools,#stage.menu #por{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const MODES={

function mGain(){const c=AU.ctx;if(!c)return null;if(!MUS.gain){MUS.gain=c.createGain();MUS.gain.gain.value=.55;MUS.gain.connect(AU.master)}return MUS.gain}
function voice(c,out){// sawtooth through vowel formants ("a"), like a male chanter
  const o1=c.createOscillator(),o2=c.createOscillator();o1.type=o2.type='sawtooth';o2.detune.value=6;
  const pre=c.createGain();pre.gain.value=.5;o1.connect(pre);o2.connect(pre);
  const vib=c.createOscillator(),vd=c.createGain();vib.frequency.value=4.8;vd.gain.value=0;vib.connect(vd);vd.connect(o1.detune);vd.connect(o2.detune);

  [[650,6,.9],[1080,8,.55],[2450,10,.18]].forEach(([f,q,a])=>{const b=c.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=q;const k=c.createGain();k.gain.value=a;pre.connect(b);b.connect(k);k.connect(g)});

function startSynth(tr){
  const c=AU.ctx,out=mGain();if(!c||!out)return null;const M=MODES[tr];if(!M)return null;
  const bus=c.createGain();bus.gain.value=0;bus.connect(out);bus.gain.setTargetAtTime(.9*M.vol,c.currentTime,1.2);
  const ison=voice(c,bus);ison.o1.frequency.value=ison.o2.frequency.value=M.f;ison.g.gain.setTargetAtTime(.055,c.currentTime,1.5);
  const br=c.createOscillator(),bg=c.createGain();br.frequency.value=.09;bg.gain.value=.012;br.connect(bg);bg.connect(ison.g.gain);br.start();
  const mel=voice(c,bus);mel.vd.gain.value=9;
  const S={bus,ison,mel,br,alive:true,deg:1,t:null};
  const hz=cents=>M.f*2*Math.pow(2,cents/1200);
  const step=()=>{if(!S.alive)return;const now=c.currentTime;
    if(!S.left){S.left=6+Math.floor(Math.random()*5);mel.g.gain.setTargetAtTime(0,now,.4);S.t=setTimeout(()=>{S.left=S.left;tick()},(2500+Math.random()*3500)*M.tempo);S.phr=true;return}
    tick()};
  const tick=()=>{if(!S.alive)return;const now=c.currentTime;
    let d=S.deg+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)];d=Math.max(M.lo,Math.min(M.hi,d));
    S.left--;if(S.left<=1)d=1;S.deg=d;
    const f=hz(M.sc[d]);mel.o1.frequency.setTargetAtTime(f,now,.07);mel.o2.frequency.setTargetAtTime(f,now,.07);
    mel.g.gain.setTargetAtTime(.032,now,.18);

  S.left=undefined;S.t=setTimeout(step,1200);
  S.stop=()=>{S.alive=false;clearTimeout(S.t);const t=c.currentTime;bus.gain.setTargetAtTime(0,t,.6);setTimeout(()=>{ison.stop();mel.stop();try{br.stop()}catch(e){}bus.disconnect()},3000)};

let teoSel=null;
function openTeo(){
  const L=G.teo;$('teoL').innerHTML=L.map(k=>`<button data-k="${k}" class="${TEO[k].g?'g':''}">${TEO[k].n}</button>`).join('');
  if(!L.length){$('teoB').classList.remove('gold');$('teoM').src='assets/teo/otac.webp';$('teoH').textContent=u('teo');$('teoP').textContent=u('teoEmpty');$('teoS').textContent=''}
  else showTeo(teoSel&&L.includes(teoSel)?teoSel:L[L.length-1]);
  $('teo').classList.add('on');
}
const MIN={otac:'teo/otac.webp',roditi:'teo/roditi.webp',molitva:'teo/molitva.webp',homoousios:'teo/homoousios.webp',kenodoksija:'teo/kenodoksija.webp',jota:'teo/jota.webp',anatema:'bg/brod.jpg',arijanstvo:'teo/arijanstvo.webp',obozenje:'teo/obozenje.webp'};
function showTeo(k){teoSel=k;const t=TEO[k];$('teoB').classList.toggle('gold',!!t.g);$('teoM').src='assets/'+(MIN[k]||'teo/otac.webp');$('teoH').textContent=t.n;$('teoP').textContent=t.t;$('teoP').scrollTop=0;$('teoS').textContent=u('src')+t.s;
  [...$('teoL').children].forEach(b=>b.classList.toggle('cur',b.dataset.k===k))}
$('teoL').addEventListener('click',e=>{const b=e.target.closest('button');if(b){SFX.page();showTeo(b.dataset.k)}});
$('teoX').onclick=()=>$('teo').classList.remove('on');
$('bT').onclick=()=>{ac();SFX.page();openTeo()};

// ---------- testimony ----------
function startT(id){
  const d=S.T[id];tm={d,cur:0,solved:[],rep:{},bonus:false,wi:0};
  setPor(C[d.who].p);tmShow();
}
function tmShow(){
  if(tm.solved.length===tm.d.layers.length){const n=tm.d.done;tm=null;$('ctrl').classList.remove('on');go(n);return}
  mode='tm';const d=tm.d,i=tm.cur;
  setPor(C[d.who].p);
  $('name').textContent=C[d.who].n;$('more').style.display='none';
  const t=tm.rep[i]?tm.rep[i][0]:d.st[i];
  $('txt').className='';clearInterval(typing);typing=null;$('txt').textContent=t;
  $('stno').textContent=`${d.title} · ${u('stmt')} ${i+1}/${d.st.length}`;
  $('ctrl').classList.add('on');
}
$('bPrev').onclick=()=>{if(!tm)return;tm.cur=(tm.cur+tm.d.st.length-1)%tm.d.st.length;tmShow()};
$('bNext').onclick=()=>{if(!tm)return;tm.cur=(tm.cur+1)%tm.d.st.length;tmShow()};
$('bPress').onclick=()=>{if(!tm)return;const key=tm.rep[tm.cur]?tm.rep[tm.cur][1]:tm.cur;const lines=(tm.d.press[key]||[]).filter(l=>req(l.req));
  $('ctrl').classList.remove('on');stack=[{a:[...lines,{tmResume:1}],i:0}];next()};
$('bPres').onclick=()=>{if(!tm)return;onPick=tmPresent;openKod(true)};
function tmPresent(k){
  const d=tm.d,i=tm.cur;$('ctrl').classList.remove('on');
  const li=d.layers.findIndex((L,j)=>L.at===i&&L.ev===k&&!tm.solved.includes(j));
  if(li>=0){const L=d.layers[li];tm.solved.push(li);if(L.rep)tm.rep[L.rep[0]]=[L.rep[1],L.rep[2]];
    const tail=[{tmResume:1}];if(L.teo)tail.unshift({teo:L.teo});stack=[{a:[...L.then,...tail],i:0}];next();return}
  if(d.bonus&&!tm.bonus&&d.bonus.at===i&&d.bonus.ev===k){tm.bonus=true;stack=[{a:[...d.bonus.then,{tmResume:1}],i:0}];next();return}
  const sp=d.special[k+'@'+i]||(k==='e4'?d.special.e4:null);
  if(sp&&k!=='e4'){stack=[{a:[...sp,{tmResume:1}],i:0}];next();return}
  wrong(sp||d.wrong[tm.wi++%d.wrong.length],[{tmResume:1}]);
}
function wrong(lines,tail){
  SFX.wrong();G.pov=Math.max(0,G.pov-1);hud();setPor(C.FILON.p);shakeP();
  let seq=[...lines];
  if(G.pov<=0){seq.push({cap:u('povLost')},{s:'NIL',t:u('nilFail')},{pov:5});}
  push([...seq,...tail]);next();
}

// ---------- ask (present without statement) ----------
function ask(c){
  const a=c.ask;mode='ask';
  $('name').textContent='';$('txt').className='th';curVoice=VOICE.THINK;type(a.q);$('more').style.display='none';
  $('stno').textContent='';$('ctrl').classList.add('on');
  ['bPrev','bNext','bPress'].forEach(id=>$(id).style.display='none');
  $('bPres').onclick=()=>{onPick=k=>{
    ['bPrev','bNext','bPress'].forEach(id=>$(id).style.display='');$('ctrl').classList.remove('on');restorePres();
    if(a.ok.includes(k)){next()}else{wrong(a.wrong,[c])}
  };openKod(true)};
}
function restorePres(){$('bPres').onclick=()=>{if(!tm)return;onPick=tmPresent;openKod(true)}}

// ---------- minigames ----------
function mini(id){
  mode='mini';const m=MINI[id],box=$('miniC');
  if(id==='price'){let miss=0;
    box.innerHTML=`<h2>${m.q}</h2>`+m.lines.map((l,i)=>`<button class="ln" data-i="${i}"><b>${l[0]}</b>${l[1]}</button>`).join('')+`<div class="msg" id="mm"></div>`;
    box.onclick=e=>{const b=e.target.closest('.ln');if(!b)return;const i=+b.dataset.i;
      if(i===m.ok){$('mini').classList.remove('on');box.onclick=null;push([{fx:'stani'},...m.win]);next()}
      else $('mm').textContent=m.miss[Math.min(i,m.miss.length-1)]};
  }
  if(id==='jota'){let miss=0;
    const words=m.text.split(' ');
    const render=()=>{box.innerHTML=`<h2>${m.q}</h2><div class="gk">${words.map((w,i)=>`<span data-i="${i}">${w}</span>`).join(' ')}</div><div class="msg" id="mm">${u('jClick')}</div>`};
    render();
    const fail=()=>{$('mini').classList.remove('on');box.onclick=null;push(S.jota_missed);next()};
    box.onclick=e=>{const s=e.target.closest('span');if(!s)return;
      if(s.dataset.l!==undefined){const li=+s.dataset.l;
        if(li===3){$('mini').classList.remove('on');box.onclick=null;push([{fx:'stani'},...S.jota_found,{note:u('tr')+m.tr}]);next();return}
        if(li===7){$('mm').textContent=u('jOusia');}
        else $('mm').textContent=u('jLetter');
        if(++miss>=4)fail();return}
      const w=words[+s.dataset.i].replace(/[·,…]/g,'');
      if(w===m.bad){box.querySelector('.gk').outerHTML=`<div class="lt">${[...m.bad].map((ch,i)=>`<span data-l="${i}">${ch}</span>`).join('')}</div>`;$('mm').textContent=u('jSusp');}
      else{$('mm').textContent=u('jWord');if(++miss>=4)fail()}};
  }
  $('mini').classList.add('on');
}

// ---------- ending / title ----------
function ending(){
  mode='end';setPor(null);
  $('endS').textContent=u('endS',G.trezEnd??G.trez,G.ev.length,Object.keys(EV).length);
  const sp=G.teo.filter(k=>TEO[k].g).length;
  const nG=Object.values(TEO).filter(t=>t.g).length;
  $('endT').textContent=u('endT',G.teo.length,Object.keys(TEO).length)+(sp?u('endSp',sp,nG):u('endNo'));
  $('endscr').classList.add('on');stage.classList.add('menu');try{localStorage.removeItem(KEY)}catch(e){}
}
$('bAgain').onclick=()=>{$('endscr').classList.remove('on');begin(null)};
$('bEndT').onclick=openTeo;
function begin(st){
  G=st||fresh();tm=null;hud();$('title').classList.remove('on');stage.classList.remove('menu');
  if(st&&st.scene){go(st.scene)}else go('uvod');
}
setBg('nikeja');G=fresh();hud();$('title').classList.add('on');stage.classList.add('menu');
const sv=load();if(sv&&sv.scene&&S[sv.scene]){$('bCont').style.display=''}
$('bStart').onclick=()=>{ac();begin(null)};
mbtn();$('bM').onclick=()=>{ac();MUS.on=!MUS.on;try{localStorage.setItem('nijote_pojanje',MUS.on?'1':'0')}catch(e){}mbtn();if(MUS.on){const t=MUS.cur;MUS.cur=null;music(t)}else stopMusic()};
$('bS').onclick=()=>{ac();AU.on=!AU.on;try{localStorage.setItem('nijote_zvuk',AU.on?'1':'0')}catch(e){}sbtn();if(AU.on)SFX.click()};sbtn();
document.querySelectorAll('#lng button').forEach(b=>{b.classList.toggle('on',b.dataset.l===LANG);b.onclick=()=>{if(b.dataset.l===LANG)return;try{localStorage.setItem('nijote_pismo',b.dataset.l)}catch(e){}location.hash={cyr:'cirilica',lat:'latinica',en:'english'}[b.dataset.l];location.reload()}});
document.addEventListener('pointerdown',()=>ac(),{once:true});
$('bCont').onclick=()=>{ac();const s=load();if(s){s.cur=null;begin(s)}else begin(null)};
}
</script>
